# Example site configuration for the Blank Magazine theme.
# Run it from the repository root with:
#   hugo server --source exampleSite --themesDir ../..
baseURL = "https://catrix.net/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "[catrix] 杂志"
theme = "blank-magazine"
enableRobotsTXT = true

[pagination]
  pagerSize = 9

[params]
  description = "立志成为全浦东最有影响力的高中生杂志。网站建设中……杂志社招募中，点击右上角Joinus查看招募信息。"
  author = ""
  authorBio = ""
  slogan = ""
  email = "contact@catrix.net"
  mainSections = ["posts"]
  firstlarge = true

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "往期"
    url = "/categories/"
    weight = 3


  [[menu.main]]
