{{ define "main" }}
<article class="admin container-narrow">
  <header class="page-header">
    <p class="page-eyebrow">Catrix · Admin</p>
    <h1 class="page-title">{{ .Title }}</h1>
    <div class="page-divider" aria-hidden="true"></div>
  </header>
  <form id="gate" class="admin-gate">
    <input id="pass" type="password" autocomplete="current-password" placeholder="暗号" aria-label="管理暗号" required>
    <button id="enter" type="submit">📮</button>
    <p id="hint" class="admin-hint" role="status"></p>
  </form>
</article>

<style>
  .admin { padding-bottom: var(--spacing-xl); }
  .admin-gate { text-align: center; padding: 6vh 0 10vh; }
  .admin-gate input, .admin-gate button {
    padding: 12px 14px; border: 1px solid var(--color-border); background: var(--color-bg);
    color: var(--color-text); font: inherit; font-size: .875rem;
  }
  .admin-gate input { width: 260px; max-width: 80%; text-align: center; }
  .admin-gate input:focus { outline: none; border-color: var(--color-text); }
  .admin-gate button { margin-left: 10px; cursor: pointer; }
  .admin-gate button:hover { background: var(--color-bg-alt); }
  .admin-gate button:disabled { opacity: .6; cursor: wait; }
  .admin-hint { margin-top: 14px; font-size: .75rem; color: var(--color-text-muted); }
  .admin-hint:empty { margin: 0; }
</style>

<script src="/js/api.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const gate = $('gate'), pass = $('pass'), enter = $('enter'), hint = $('hint');

  async function tryKey(key) {
    const res = await fetch(window.CATRIX_API + '/admin/list', {
      headers: { 'X-Admin-Key': key },
    });
    if ([401, 403, 404].includes(res.status)) return false;
    if (!res.ok) throw new Error('后台读取失败（' + res.status + '）。');
    localStorage.setItem('catrixAdmin', key);
    location.replace('/admin/');
    return true;
  }

  gate.addEventListener('submit', async event => {
    event.preventDefault();
    if (enter.disabled) return;
    enter.disabled = true;
    hint.textContent = '验证中…';
    try {
      if (!(await tryKey(pass.value))) {
        hint.textContent = '暗号不对。';
        pass.focus();
      }
    } catch (error) {
      hint.textContent = error instanceof TypeError
        ? '连接失败，请确认 Worker 已启动。'
        : error.message;
    } finally {
      enter.disabled = false;
    }
  });
})();
</script>
{{ end }}
