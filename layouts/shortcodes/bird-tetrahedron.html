{{ $id := .Get "id" | default (printf "tetra-%d" now.UnixNano) }}
<div class="catrix-tetra-wrapper" id="{{ $id }}">
  <!-- 样式隔离与容器定义 -->
  <style>
    #{{ $id }} {
      width: 100%;
      margin: 20px auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      box-sizing: border-box;
    }
    #{{ $id }} .widget-container {
      width: 100% !important;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid #111827;
      border-radius: 0 !important;
      color: #111827;
    }
    #{{ $id }} * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }
    #{{ $id }} .widget-header {
      border-bottom: 2px solid #111827;
      padding-bottom: 10px;
    }
    #{{ $id }} .widget-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    #{{ $id }} .widget-subtitle {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #4b5563;
      font-family: ui-monospace, monospace;
    }
    #{{ $id }} .widget-viewport {
      position: relative;
      width: 100%;
      height: 420px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      overflow: hidden;
      touch-action: none;
    }
    #{{ $id }} canvas.three-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #{{ $id }} canvas.three-canvas:active {
      cursor: grabbing;
    }
    #{{ $id }} .info-card {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #111827;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      font-family: ui-monospace, monospace;
    }
    #{{ $id }} .info-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    #{{ $id }} .color-dot {
      width: 10px;
      height: 10px;
      display: inline-block;
    }
    #{{ $id }} .info-desc {
      font-size: 11px;
      color: #4b5563;
    }
    #{{ $id }} .vertex-legend {
      position: absolute;
      bottom: 10px;
      left: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      pointer-events: auto;
    }
    #{{ $id }} .legend-chip {
      padding: 5px 10px;
      background: #ffffff;
      border: 1px solid #111827;
      font-size: 11px;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      color: #111827;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #{{ $id }} .legend-chip:hover, #{{ $id }} .legend-chip.is-active {
      background: #111827;
      color: #ffffff;
    }
    #{{ $id }} .control-deck {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #111827;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }
    #{{ $id }} .control-deck label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>

  <!-- 引入 Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- 组件 DOM -->
  <div class="widget-container">
    <div class="widget-header">
      <h3 class="widget-title">四色视觉色彩四面体 (Tetrachromatic Color Space)</h3>
      <p class="widget-subtitle">TETRAHEDRON MANIFOLD & 3D SPECTRAL LOCUS (300 - 700 NM)</p>
    </div>

    <div class="widget-viewport">
      <canvas class="three-canvas"></canvas>

      <div class="info-card">
        <div class="info-badge">
          <span class="color-dot" style="background: #a855f7;"></span>
          <span class="info-title">近紫外线 (UV)</span>
        </div>
        <div class="info-desc">波段 ~370 nm | 刺激顶点: UV</div>
      </div>

      <div class="vertex-legend">
        <button type="button" class="legend-chip is-active" data-v="uv">
          <span class="color-dot" style="background: #a855f7;"></span> UV (370nm)
        </button>
        <button type="button" class="legend-chip" data-v="s">
          <span class="color-dot" style="background: #2563eb;"></span> SWS (445nm)
        </button>
        <button type="button" class="legend-chip" data-v="m">
          <span class="color-dot" style="background: #16a34a;"></span> MWS (535nm)
        </button>
        <button type="button" class="legend-chip" data-v="l">
          <span class="color-dot" style="background: #dc2626;"></span> LWS (565nm)
        </button>
      </div>
    </div>

    <div class="control-deck">
      <div>
        <label>
          <input type="checkbox" class="toggle-curve" checked>
          显示三维马蹄形空间光谱轨迹管线
        </label>
      </div>
      <div>
        <label>
          <input type="checkbox" class="toggle-rotate" checked>
          自动慢速自转 (可鼠标按住拖拽视角 / 滚轮缩放)
        </label>
      </div>
    </div>
  </div>

  <!-- 组件驱动 JS -->
  <script>
  (function() {
    const scope = document.getElementById("{{ $id }}");
    if (!scope) return;

    const VERTICES_DATA = {
      uv: { name: "近紫外 (UV)", band: "~370 nm", desc: "近紫外受体，鸟类辨识羽毛暗纹与花蜜引导通道", pos: new THREE.Vector3(0, 1.0, 0), color: 0xa855f7, hexStr: "#a855f7" },
      s:  { name: "短波蓝 (SWS)", band: "~445 nm", desc: "短波蓝光受体，天光与高能蓝紫色彩感知", pos: new THREE.Vector3(-0.94, -0.33, 0), color: 0x2563eb, hexStr: "#2563eb" },
      m:  { name: "中波绿 (MWS)", band: "~535 nm", desc: "中波绿光受体，捕获林间植被反射光", pos: new THREE.Vector3(0.47, -0.33, -0.81), color: 0x16a34a, hexStr: "#16a34a" },
      l:  { name: "长波红 (LWS)", band: "~565 nm", desc: "长波红光受体，成熟果实与警戒色高分辨识别", pos: new THREE.Vector3(0.47, -0.33, 0.81), color: 0xdc2626, hexStr: "#dc2626" }
    };

    let scene, camera, renderer, mainGroup, curveMesh, raycaster, mouse;
    const sphereMeshes = {};
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let autoRotate = true;
    let selectedKey = 'uv';

    const container = scope.querySelector('.widget-viewport');
    const canvas = scope.querySelector('canvas.three-canvas');
    const infoDot = scope.querySelector('.info-badge .color-dot');
    const infoTitle = scope.querySelector('.info-title');
    const infoDesc = scope.querySelector('.info-desc');
    const toggleRotate = scope.querySelector('.toggle-rotate');
    const toggleCurve = scope.querySelector('.toggle-curve');
    const chips = scope.querySelectorAll('.legend-chip');

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(2.8, 1.8, 3.4);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight1.position.set(5, 8, 5);
      scene.add(dirLight1);

      mainGroup = new THREE.Group();
      scene.add(mainGroup);

      buildTetrahedron();
      buildSpectralCurve();

      const centerGeo = new THREE.SphereGeometry(0.04, 16, 16);
      const centerMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
      mainGroup.add(new THREE.Mesh(centerGeo, centerMat));

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      canvas.addEventListener('pointerdown', e => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('pointermove', e => {
        if (!isDragging) return;
        const dx = e.clientX - previousMousePosition.x;
        const dy = e.clientY - previousMousePosition.y;
        mainGroup.rotation.y += dx * 0.008;
        mainGroup.rotation.x += dy * 0.008;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('pointerup', () => { isDragging = false; });

      canvas.addEventListener('click', onCanvasClick);
      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        camera.position.multiplyScalar(e.deltaY > 0 ? 1.05 : 0.95);
        camera.position.clampLength(1.8, 8.0);
      }, { passive: false });

      window.addEventListener('resize', onResize);

      toggleRotate.addEventListener('change', e => { autoRotate = e.target.checked; });
      toggleCurve.addEventListener('change', e => { if (curveMesh) curveMesh.visible = e.target.checked; });
      chips.forEach(btn => btn.addEventListener('click', () => selectVertex(btn.dataset.v)));

      selectVertex('uv');
      animate();
    }

    function buildTetrahedron() {
      const keys = Object.keys(VERTICES_DATA);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x9ca3af, transparent: true, opacity: 0.6 });

      for (let i = 0; i < keys.length; i++) {
        for (let j = i + 1; j < keys.length; j++) {
          const p1 = VERTICES_DATA[keys[i]].pos;
          const p2 = VERTICES_DATA[keys[j]].pos;
          const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
          mainGroup.add(new THREE.Line(geo, lineMat));
        }
      }

      keys.forEach(k => {
        const data = VERTICES_DATA[k];
        const geo = new THREE.SphereGeometry(0.07, 20, 20);
        const mat = new THREE.MeshStandardMaterial({
          color: data.color, roughness: 0.3, emissive: data.color, emissiveIntensity: 0.2
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(data.pos);
        mesh.userData = { key: k };
        mainGroup.add(mesh);
        sphereMeshes[k] = mesh;
      });
    }

    function wavelengthToRGB(wl) {
      let r = 0, g = 0, b = 0;
      if (wl >= 300 && wl < 440) { r = -(wl - 440) / 140; b = 1.0; }
      else if (wl >= 440 && wl < 490) { g = (wl - 440) / 50; b = 1.0; }
      else if (wl >= 490 && wl < 510) { g = 1.0; b = -(wl - 510) / 20; }
      else if (wl >= 510 && wl < 580) { r = (wl - 510) / 70; g = 1.0; }
      else if (wl >= 580 && wl < 645) { r = 1.0; g = -(wl - 645) / 65; }
      else if (wl >= 645 && wl <= 700) { r = 1.0; }
      return new THREE.Color(r, g, b);
    }

    function buildSpectralCurve() {
      const points = [];
      const numSamples = 100;
      for (let i = 0; i <= numSamples; i++) {
        const wl = 300 + (i / numSamples) * 400;
        const r_uv = Math.exp(-Math.pow((wl - 370) / 35, 2));
        const r_s  = Math.exp(-Math.pow((wl - 445) / 40, 2));
        const r_m  = Math.exp(-Math.pow((wl - 535) / 45, 2));
        const r_l  = Math.exp(-Math.pow((wl - 565) / 50, 2));
        const sum = r_uv + r_s + r_m + r_l + 1e-6;
        const pos = new THREE.Vector3()
          .addScaledVector(VERTICES_DATA.uv.pos, r_uv / sum)
          .addScaledVector(VERTICES_DATA.s.pos, r_s / sum)
          .addScaledVector(VERTICES_DATA.m.pos, r_m / sum)
          .addScaledVector(VERTICES_DATA.l.pos, r_l / sum);
        points.push(pos);
      }
      const curve = new THREE.CatmullRomCurve3(points, true);
      const tubeGeo = new THREE.TubeGeometry(curve, 80, 0.02, 6, true);
      const posAttr = tubeGeo.attributes.position;
      const vColors = new Float32Array(posAttr.count * 3);
      for (let i = 0; i < posAttr.count; i++) {
        const t = i / posAttr.count;
        const col = wavelengthToRGB(300 + t * 400);
        vColors[i*3] = col.r; vColors[i*3+1] = col.g; vColors[i*3+2] = col.b;
      }
      tubeGeo.setAttribute('color', new THREE.BufferAttribute(vColors, 3));
      const tubeMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.3 });
      curveMesh = new THREE.Mesh(tubeGeo, tubeMat);
      mainGroup.add(curveMesh);
    }

    function onCanvasClick(e) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(Object.values(sphereMeshes));
      if (hits.length > 0) selectVertex(hits[0].object.userData.key);
    }

    function selectVertex(key) {
      selectedKey = key;
      Object.keys(sphereMeshes).forEach(k => {
        sphereMeshes[k].scale.setScalar(k === key ? 1.35 : 1.0);
      });
      const d = VERTICES_DATA[key];
      infoDot.style.background = d.hexStr;
      infoTitle.textContent = d.name;
      infoDesc.textContent = `${d.band} | ${d.desc}`;
      chips.forEach(c => c.classList.toggle('is-active', c.dataset.v === key));
    }

    function onResize() {
      if (!container || !renderer || !camera) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate && !isDragging) mainGroup.rotation.y += 0.004;
      renderer.render(scene, camera);
    }

    init();
  })();
  </script>
</div>
