{{ if and (eq .Section "posts") (ne .Params.likes false) .Site.Params.comments.apiURL }}
{{ $js := resources.Get "js/article-like.js" | minify | fingerprint }}
<section class="article-appreciation" data-article-like data-api="{{ replaceRE "/comments/?$" "" .Site.Params.comments.apiURL }}" data-article="{{ strings.TrimPrefix .Site.Home.RelPermalink .RelPermalink | printf "/%s" }}">
  <div><p>喜欢这篇文章？</p><small>给作者一点鼓励。</small></div>
  <button type="button" disabled aria-pressed="false">♡ 读取点赞中</button><span role="status"></span>
</section>
<style>.article-appreciation{margin:36px 0;padding:24px;border-block:1px solid #dce1d8;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.article-appreciation p{margin:0 0 5px;font-weight:600}.article-appreciation small{color:#687467}.article-appreciation button{font:inherit;padding:12px 20px;min-height:44px;border:1px solid #375744;border-radius:24px;background:white;color:#375744;cursor:pointer}.article-appreciation button[aria-pressed=true]{background:#375744;color:white}.article-appreciation span{font-size:13px;flex-basis:100%}</style>
<script src="{{ "js/community-client.js" | relURL }}?v=4" defer></script>
<script src="{{ $js.RelPermalink }}" defer integrity="{{ $js.Data.Integrity }}"></script>
{{ end }}
