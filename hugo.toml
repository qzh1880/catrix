# Example site configuration for the Blank Magazine theme.
# Run it from the repository root with:
#   hugo server --source exampleSite --themesDir ../..
baseURL = "https://catrix.net/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "[catrix] 杂志"
theme = "blank-magazine"
enableRobotsTXT = true

[pagination]
  pagerSize = 9

[params]
  description = "立志成为全浦东最有影响力的高中生杂志。网站建设中……杂志社招募中，点击右上角Joinus查看招募信息。"
  author = ""
  authorBio = ""
  slogan = ""
  email = "contact@catrix.net"
  mainSections = ["posts"]

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "往期"
    url = "/categories/"
    weight = 3


  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 5

  [[menu.main]]
    parent = "more"
    name = "加入CATRIX"
    url = "/joinus/"
    weight = 6
  [[menu.main]]
    name = "更多"
    identifier = "more"    
    url = "/more/"
    weight = 67
  [[menu.main]]
    name = "球员身价榜"
    parent = "more"
    url = "https://www.jcleague.win/"
    weight = 2
  [[menu.main]]
    name = "小游戏"
    parent = "more"
    url = "/games/"
    weight = 3
[taxonomies]
  tag = "tags"
  category = "categories"
  author = "author"
[outputs]
  home = ["HTML", "RSS", "JSON"]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
inline = [['$', '$']]
block  = [['$$', '$$']]

# 评论后台部署并完成数据库迁移后，再填写真实 API 地址并开启。
# GitHub Pages 提供前端文件，不能直接执行仓库中的 Worker 代码。
[params.comments]
  enabled = true
  apiURL = "https://comments-api.catrix.net/comments"

[[menu.main]]
  name = "网站反馈"
  parent = "more"
  url = "/feedback/"
  weight = 4
