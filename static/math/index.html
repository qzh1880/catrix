<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>空间三角形正投影与姿态分析</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #000000;
    }
    .subtitle {
      font-size: 12px;
      color: #666666;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }
    .toolbar {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      border: 1px solid #d0d0d0;
      padding: 12px 16px;
      background: #fafafa;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-group label {
      font-size: 12px;
      font-weight: 600;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      color: #444;
    }
    input[type="number"] {
      width: 64px;
      height: 32px;
      padding: 4px 8px;
      border: 1px solid #b0b0b0;
      background: #ffffff;
      color: #000;
      font-size: 13px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      text-align: center;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #000000;
    }
    button {
      height: 32px;
      padding: 0 16px;
      background: #1a1a1a;
      color: #ffffff;
      border: 1px solid #1a1a1a;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    button:active {
      background: #444444;
    }
    button.secondary {
      background: #ffffff;
      color: #1a1a1a;
      border: 1px solid #b0b0b0;
    }
    button.secondary:active {
      background: #f0f0f0;
    }
    .error-tag {
      font-size: 12px;
      color: #d32f2f;
      display: none;
      font-weight: 500;
    }
    #viewport-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 520px;
      border: 1px solid #1a1a1a;
      background: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      color: #666;
      line-height: 1.5;
      pointer-events: none;
    }
    .data-table-container {
      width: 100%;
      max-width: 800px;
      margin-top: 16px;
      border: 1px solid #1a1a1a;
      border-top: none;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .data-table th, .data-table td {
      border-top: 1px solid #1a1a1a;
      padding: 10px 14px;
      text-align: left;
    }
    .data-table th {
      background: #f4f4f4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #333;
      width: 25%;
    }
    .data-table td.val-primary {
      font-size: 15px;
      font-weight: 700;
      color: #000000;
    }
    .data-table td.val-secondary {
      font-size: 12px;
      color: #666666;
    }
    @media (max-width: 600px) {
      #viewport-container { height: 400px; }
      .data-table th, .data-table td { padding: 8px 10px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Orthographic Triangle Projection</h1>
    <div class="subtitle">AUTODESK INVENTOR STYLE TRACKBALL</div>
  </header>

  <div class="toolbar">
    <div class="input-group">
      <label for="sideA">A:</label>
      <input type="number" id="sideA" value="3" min="0.1" step="0.5">
    </div>
    <div class="input-group">
      <label for="sideB">B:</label>
      <input type="number" id="sideB" value="4" min="0.1" step="0.5">
    </div>
    <div class="input-group">
      <label for="sideC">C:</label>
      <input type="number" id="sideC" value="5" min="0.1" step="0.5">
    </div>
    <button id="btnUpdate">更新比例</button>
    <button id="btnReset" class="secondary">视角复位</button>
    <span class="error-tag" id="errorMsg">无效三角形 (两边之和须大于第三边)</span>
  </div>

  <div id="viewport-container">
    <canvas id="viewport"></canvas>
    <div class="hud-overlay">
      PROJECTION: ORTHOGRAPHIC (FRONT VIEW / XY PLANE)<br>
      DRAG: 3D ORBIT | PINCH/WHEEL: ZOOM
    </div>
  </div>

  <div class="data-table-container">
    <table class="data-table">
      <tr>
        <th>投影三边比</th>
        <td class="val-primary" id="valRatio">-- : -- : --</td>
        <td class="val-secondary" id="valLengths">a' = --, b' = --, c' = --</td>
      </tr>
      <tr>
        <th>投影三个内角</th>
        <td class="val-primary" id="valAngles">∠A' = --°, ∠B' = --°, ∠C' = --°</td>
        <td class="val-secondary" id="valAngleSum">内角和: 180.0°</td>
      </tr>
    </table>
  </div>

  <script>
    class Vec3 {
      constructor(x=0, y=0, z=0) { this.x = x; this.y = y; this.z = z; }
      add(v) { return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z); }
      sub(v) { return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z); }
      scale(s) { return new Vec3(this.x * s, this.y * s, this.z * s); }
      dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
      cross(v) {
        return new Vec3(
          this.y * v.z - this.z * v.y,
          this.z * v.x - this.x * v.z,
          this.x * v.y - this.y * v.x
        );
      }
      length() { return Math.hypot(this.x, this.y, this.z); }
      normalize() {
        const l = this.length();
        return l > 1e-6 ? new Vec3(this.x / l, this.y / l, this.z / l) : new Vec3(0,0,0);
      }
    }

    class Quat {
      constructor(w=1, x=0, y=0, z=0) { this.w = w; this.x = x; this.y = y; this.z = z; }
      multiply(q) {
        return new Quat(
          this.w*q.w - this.x*q.x - this.y*q.z - this.z*q.z,
          this.w*q.x + this.x*q.w + this.y*q.z - this.z*q.y,
          this.w*q.y - this.x*q.z + this.y*q.w + this.z*q.x,
          this.w*q.z + this.x*q.y - this.y*q.x + this.z*q.w
        );
      }
      rotateVec3(v) {
        const u = new Vec3(this.x, this.y, this.z);
        const s = this.w;
        return u.scale(2 * u.dot(v))
          .add(v.scale(s * s - u.dot(u)))
          .add(u.cross(v).scale(2 * s));
      }
      static fromAxisAngle(axis, angle) {
        const a = axis.normalize();
        const half = angle / 2;
        const sin = Math.sin(half);
        return new Quat(Math.cos(half), a.x * sin, a.y * sin, a.z * sin);
      }
    }

    const container = document.getElementById('viewport-container');
    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d');

    let orientation = new Quat(1, 0, 0, 0);
    let scale = 1.0;
    let baseVertices = [];
    const TRACKBALL_RADIUS = 150;

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    function buildTriangle(a, b, c) {
      if (a + b <= c || a + c <= b || b + c <= a) return null;
      const cosC = (a * a + b * b - c * c) / (2 * a * b);
      const sinC = Math.sqrt(Math.max(0, 1 - cosC * cosC));
      const pC = new Vec3(0, 0, 0);
      const pB = new Vec3(a, 0, 0);
      const pA = new Vec3(b * cosC, b * sinC, 0);

      const center = pA.add(pB).add(pC).scale(1 / 3);
      const vA = pA.sub(center);
      const vB = pB.sub(center);
      const vC = pC.sub(center);

      const maxR = Math.max(vA.length(), vB.length(), vC.length());
      const fit = (TRACKBALL_RADIUS * 0.85) / (maxR || 1);
      return [vA.scale(fit), vB.scale(fit), vC.scale(fit)];
    }

    function initTriangle() {
      const a = parseFloat(document.getElementById('sideA').value);
      const b = parseFloat(document.getElementById('sideB').value);
      const c = parseFloat(document.getElementById('sideC').value);

      const err = document.getElementById('errorMsg');
      const verts = buildTriangle(a, b, c);
      if (!verts) {
        err.style.display = 'inline';
        return;
      }
      err.style.display = 'none';
      baseVertices = verts;
      render();
    }

    const activePointers = new Map();
    let initialPinchDistance = null;
    let initialPinchScale = 1.0;

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        initialPinchScale = scale;
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;

      if (activePointers.size === 1) {
        const prev = activePointers.get(e.pointerId);
        const dx = e.clientX - prev.x;
        const dy = e.clientY - prev.y;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (dx === 0 && dy === 0) return;

        const dist = Math.hypot(dx, dy);
        const axis = new Vec3(dy, dx, 0).normalize();
        const angle = dist * 0.008;

        const dq = Quat.fromAxisAngle(axis, angle);
        orientation = dq.multiply(orientation);
        render();
      } else if (activePointers.size === 2) {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const pts = Array.from(activePointers.values());
        const curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (initialPinchDistance && initialPinchDistance > 10) {
          const factor = curDist / initialPinchDistance;
          scale = Math.min(Math.max(initialPinchScale * factor, 0.4), 2.5);
          render();
        }
      }
    });

    function endPointer(e) {
      if (activePointers.has(e.pointerId)) {
        activePointers.delete(e.pointerId);
      }
      if (activePointers.size < 2) {
        initialPinchDistance = null;
      }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoom = e.deltaY > 0 ? 0.94 : 1.06;
      scale = Math.min(Math.max(scale * zoom, 0.4), 2.5);
      render();
    }, { passive: false });

    document.getElementById('btnUpdate').addEventListener('click', initTriangle);
    document.getElementById('btnReset').addEventListener('click', () => {
      orientation = new Quat(1, 0, 0, 0);
      scale = 1.0;
      render();
    });

    function drawInventorBall(cx, cy, R) {
      ctx.save();
      ctx.lineWidth = 1;

      // 1. 外围固定屏幕投影圆环
      ctx.strokeStyle = '#d5d5d5';
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();

      // 2. 四方卡位定位点
      const handleSize = 5;
      ctx.fillStyle = '#666';
      [[cx + R, cy], [cx - R, cy], [cx, cy + R], [cx, cy - R]].forEach(([hx, hy]) => {
        ctx.fillRect(hx - handleSize/2, hy - handleSize/2, handleSize, handleSize);
      });

      // 3. 随动空间大圆经纬辅助线
      function draw3DCircle(normal, strokeColor, dash = []) {
        ctx.strokeStyle = strokeColor;
        ctx.setLineDash(dash);
        ctx.beginPath();
        const steps = 64;
        let started = false;
        for (let i = 0; i <= steps; i++) {
          const theta = (i / steps) * Math.PI * 2;
          let p;
          if (Math.abs(normal.z) > 0.9) {
            p = new Vec3(Math.cos(theta) * R, Math.sin(theta) * R, 0);
          } else if (Math.abs(normal.y) > 0.9) {
            p = new Vec3(Math.cos(theta) * R, 0, Math.sin(theta) * R);
          } else {
            p = new Vec3(0, Math.cos(theta) * R, Math.sin(theta) * R);
          }
          const rotP = orientation.rotateVec3(p);
          const sx = cx + rotP.x;
          const sy = cy - rotP.y;
          if (!started) { ctx.moveTo(sx, sy); started = true; }
          else { ctx.lineTo(sx, sy); }
        }
        ctx.stroke();
      }

      draw3DCircle(new Vec3(0, 0, 1), '#e2e2e2', [3, 3]);
      draw3DCircle(new Vec3(0, 1, 0), '#e2e2e2', [3, 3]);
      draw3DCircle(new Vec3(1, 0, 0), '#e2e2e2', [3, 3]);

      // 4. 三维正交轴标
      const axisLen = R * 0.28;
      const axes = [
        { dir: new Vec3(1, 0, 0), label: 'X', color: '#c53929' },
        { dir: new Vec3(0, 1, 0), label: 'Y', color: '#2e7d32' },
        { dir: new Vec3(0, 0, 1), label: 'Z', color: '#1565c0' }
      ];
      ctx.setLineDash([]);
      ctx.lineWidth = 1.5;
      axes.forEach(axis => {
        const rDir = orientation.rotateVec3(axis.dir);
        const endX = cx + rDir.x * axisLen;
        const endY = cy - rDir.y * axisLen;

        ctx.strokeStyle = axis.color;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.font = '10px "SF Mono", monospace';
        ctx.fillStyle = axis.color;
        ctx.fillText(axis.label, endX + (rDir.x >= 0 ? 4 : -10), endY + (rDir.y >= 0 ? -4 : 10));
      });

      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy); ctx.lineTo(cx + 4, cy);
      ctx.moveTo(cx, cy - 4); ctx.lineTo(cx, cy + 4);
      ctx.stroke();

      ctx.restore();
    }

    function render() {
      const rect = container.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;

      ctx.clearRect(0, 0, rect.width, rect.height);

      const currentR = TRACKBALL_RADIUS * scale;
      drawInventorBall(cx, cy, currentR);

      if (!baseVertices || baseVertices.length < 3) return;

      const rotated = baseVertices.map(v => orientation.rotateVec3(v).scale(scale));
      const proj = rotated.map(p => ({
        screenX: cx + p.x,
        screenY: cy - p.y,
        x: p.x,
        y: p.y,
        z: p.z
      }));

      const edge1 = rotated[1].sub(rotated[0]);
      const edge2 = rotated[2].sub(rotated[0]);
      const normal = edge1.cross(edge2);
      const isFront = normal.z >= 0;

      ctx.beginPath();
      ctx.moveTo(proj[0].screenX, proj[0].screenY);
      ctx.lineTo(proj[1].screenX, proj[1].screenY);
      ctx.lineTo(proj[2].screenX, proj[2].screenY);
      ctx.closePath();

      ctx.fillStyle = isFront ? 'rgba(0, 0, 0, 0.05)' : 'rgba(0, 0, 0, 0.02)';
      ctx.fill();

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.75;
      ctx.stroke();

      const labels = ['A', 'B', 'C'];
      proj.forEach((pt, idx) => {
        ctx.fillStyle = '#000000';
        ctx.fillRect(pt.screenX - 2.5, pt.screenY - 2.5, 5, 5);

        ctx.font = '11px "SF Mono", Menlo, Consolas, monospace';
        ctx.fillStyle = '#1a1a1a';
        ctx.fillText(`${labels[idx]}' `, pt.screenX + 6, pt.screenY - 6);
      });

      updateMetrics(proj[0], proj[1], proj[2]);
    }

    function updateMetrics(pA, pB, pC) {
      const lenA = Math.hypot(pB.x - pC.x, pB.y - pC.y);
      const lenB = Math.hypot(pC.x - pA.x, pC.y - pA.y);
      const lenC = Math.hypot(pA.x - pB.x, pA.y - pB.y);

      function calcAngle(a, b, c) {
        if (a <= 1e-4 || b <= 1e-4) return 0;
        let cos = (b * b + c * c - a * a) / (2 * b * c);
        cos = Math.max(-1, Math.min(1, cos));
        return Math.acos(cos) * (180 / Math.PI);
      }

      const angleA = calcAngle(lenA, lenB, lenC);
      const angleB = calcAngle(lenB, lenA, lenC);
      const angleC = calcAngle(lenC, lenA, lenB);

      const minLen = Math.min(lenA, lenB, lenC);
      let rA, rB, rC;
      if (minLen > 1e-3) {
        rA = (lenA / minLen).toFixed(2);
        rB = (lenB / minLen).toFixed(2);
        rC = (lenC / minLen).toFixed(2);
      } else {
        rA = "0.0"; rB = "0.0"; rC = "0.0";
      }

      document.getElementById('valRatio').innerText = `${rA} : ${rB} : ${rC}`;
      document.getElementById('valLengths').innerText = 
        `a' = ${lenA.toFixed(1)} px,  b' = ${lenB.toFixed(1)} px,  c' = ${lenC.toFixed(1)} px`;
      
      document.getElementById('valAngles').innerText = 
        `∠A' = ${angleA.toFixed(1)}°,  ∠B' = ${angleB.toFixed(1)}°,  ∠C' = ${angleC.toFixed(1)}°`;
      
      const sum = (angleA + angleB + angleC).toFixed(1);
      document.getElementById('valAngleSum').innerText = 
        `内角和: ${sum}° ${sum < 179 ? '(接近垂直退化状态)' : ''}`;
    }

    initTriangle();
    resizeCanvas();
  </script>
</body>
</html>
