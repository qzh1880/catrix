<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕的海边骑行</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5eee1; color: #254c54; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    main { width: min(1100px, 100%); padding: 30px 18px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 12px 24px; }
    .eyebrow { font-size: 11px; letter-spacing: 4px; font-weight: 700; }
    h1 { margin: 10px 0 0; font-size: clamp(25px, 4vw, 42px); font-weight: 600; letter-spacing: 2px; }
    header p { font-size: 13px; opacity: .65; }
    .scene { overflow: hidden; border-radius: 24px; box-shadow: 0 20px 55px #325b5412; background: #d9eeeb; }
    svg { display: block; width: 100%; height: auto; }
    footer { padding: 20px 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 15px; font-size: 12px; letter-spacing: 1px; opacity: .8; }
    button { border: 1px solid #254c5430; padding: 9px 18px; border-radius: 30px; background: transparent; color: inherit; cursor: pointer; font: inherit; }
    button:hover { background: #254c540c; }
    .spin { animation: rotation 1.3s linear infinite; }
    .bob { animation: bob .65s ease-in-out infinite alternate; }
    .scarf { animation: flutter .65s ease-in-out infinite alternate; transform-origin: 510px 269px; }
    .wing { animation: flutter 1.3s ease-in-out infinite alternate; transform-origin: 474px 308px; }
    .road { animation: road 2s linear infinite; }
    .cloud { animation: drift 24s linear infinite; }
    .cloud.slow { animation-duration: 38s; }
    .paused * { animation-play-state: paused !important; }
    @keyframes rotation { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px); } }
    @keyframes flutter { to { transform: rotate(-5deg); } }
    @keyframes road { to { transform: translateX(-240px); } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @media (prefers-reduced-motion: reduce) { .scene * { animation-play-state: paused; } }
    @media (max-width: 600px) { header p { display: none; } footer { font-size: 10px; } }
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">THE SEASIDE CYCLING CLUB</div><h1>顺着海风，慢慢骑。</h1></div><p>一只鹈鹕的悠闲午后</p></header>
  <div class="scene" id="scene">
    <svg viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车的二维动画</title>
      <desc id="desc">白色鹈鹕戴着绿色帽子和红色围巾，踩着黄色自行车沿海岸前进。车轮和脚踏转动，白云和道路向后移动。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d5ece9"/><stop offset="1" stop-color="#eef4df"/></linearGradient>
        <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#90c9c3"/><stop offset="1" stop-color="#b5dad0"/></linearGradient>
        <g id="cloud" fill="#fffdf1"><path d="M0 28 Q0 7 24 10 Q34 -15 58 5 Q83 -5 88 18 Q112 15 113 32 H0Z"/></g>
        <g id="spokes" stroke="#7a9390" stroke-width="2"><path d="M-76 0H76M0-76V76M-54-54L54 54M-54 54L54-54"/><circle r="7" fill="#f8f3de" stroke="#244952" stroke-width="4"/></g>
        <g id="grass" fill="none" stroke="#789b7e" stroke-width="3" stroke-linecap="round"><path d="M0 0q-2-17-10-23M0 0q4-25 11-28M0 0q10-12 18-13"/></g>
      </defs>
      <path fill="url(#sky)" d="M0 0h1000v620H0z"/>
      <circle cx="772" cy="115" r="49" fill="#f8ce75"/>
      <circle cx="772" cy="115" r="64" fill="#f8ce75" opacity=".13"/>
      <g class="cloud" opacity=".85"><use href="#cloud" x="180" y="103"/><use href="#cloud" x="700" y="60"/><use href="#cloud" x="1380" y="103"/><use href="#cloud" x="1900" y="60"/></g>
      <g class="cloud slow" opacity=".55"><use href="#cloud" x="420" y="155"/><use href="#cloud" x="1080" y="178"/><use href="#cloud" x="1620" y="155"/><use href="#cloud" x="2280" y="178"/></g>
      <g stroke="#759f9e" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M112 205q8-9 16 0q8-9 16 0M839 217q7-8 14 0q7-8 14 0"/></g>
      <path d="M0 298Q120 263 255 293T520 295T780 281T1000 294V399H0Z" fill="#a3ccc1"/>
      <path d="M0 318H1000V454H0Z" fill="url(#sea)"/>
      <g fill="none" stroke="#e9f4de" stroke-width="3" opacity=".65" stroke-linecap="round"><path d="M40 345h100m70 25h135m384-29h112m-76 45h150M10 401h140m377-55h68m-171 53h115m312 22h74"/></g>
      <path d="M0 443Q220 412 430 442T1000 432V620H0Z" fill="#e8dcb8"/>
      <path d="M0 485H1000V581H0Z" fill="#c5c6ad"/>
      <path d="M0 486H1000" stroke="#f9edcd" stroke-width="5"/>
      <g class="road" stroke="#f8efd7" stroke-width="4" stroke-linecap="round"><path d="M-100 549h65m175 0h65m175 0h65m175 0h65m175 0h65m175 0h65"/></g>
      <g class="road"><use href="#grass" x="115" y="473"/><use href="#grass" x="815" y="465"/><use href="#grass" x="1055" y="473"/><use href="#grass" x="355" y="607"/><use href="#grass" x="1075" y="607"/></g>
      <ellipse cx="503" cy="514" rx="224" ry="15" fill="#53665b" opacity=".13"/>
      <!-- Wheels rotate around their own axles. -->
      <g transform="translate(350 429)"><circle r="83" fill="#eff1d3" fill-opacity=".18" stroke="#244952" stroke-width="12"/><circle r="76" fill="none" stroke="#f7edd2" stroke-width="3"/><g class="spin"><use href="#spokes"/></g></g>
      <g transform="translate(654 429)"><circle r="83" fill="#eff1d3" fill-opacity=".18" stroke="#244952" stroke-width="12"/><circle r="76" fill="none" stroke="#f7edd2" stroke-width="3"/><g class="spin"><use href="#spokes"/></g></g>
      <!-- Far foot and rotating crank. -->
      <g transform="translate(477 429)"><g class="spin"><path d="M0 0L-31 0" stroke="#50686a" stroke-width="7"/><path d="M-47 0h30" stroke="#de923f" stroke-width="12" stroke-linecap="round"/></g></g>
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M350 429L418 324L477 429H350L581 324L477 429M581 324L654 429" stroke="#b97b36" stroke-width="12"/>
        <path d="M350 426L418 321L477 426H350L581 321L477 426M581 321L654 426" stroke="#edb94f" stroke-width="7"/>
        <path d="M418 324L407 302M581 324L567 281Q563 270 578 268H605" stroke="#31565a" stroke-width="8"/>
        <path d="M386 302H429" stroke="#294950" stroke-width="13"/>
        <path d="M604 268h14" stroke="#bd7653" stroke-width="10"/>
        <path d="M603 278Q639 312 643 373" stroke="#426c6d" stroke-width="2"/>
        <path d="M275 410Q293 331 369 344M603 350Q679 324 719 388" stroke="#e6a647" stroke-width="6"/>
      </g>
      <!-- Pelican silhouette, long neck, throat pouch and beak. -->
      <g class="bob">
        <path d="M420 343Q430 374 459 385L477 429" fill="none" stroke="#da973f" stroke-width="12" stroke-linecap="round"/>
        <path d="M398 328Q364 330 342 302L383 301Q359 283 356 270L411 286Z" fill="#fcf8e8" stroke="#31565a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M389 280Q420 250 465 271Q480 274 487 255L492 206Q492 175 518 172Q549 169 557 192Q565 215 543 232L535 271Q542 307 511 333Q477 360 433 347Q393 337 389 310Z" fill="#fffbed" stroke="#31565a" stroke-width="3"/>
        <path d="M514 229Q510 279 523 296Q512 331 471 339Q488 310 481 284Q501 278 504 230Z" fill="#e0e9dc"/>
        <path d="M541 204L658 218Q626 265 576 250Q547 239 541 218Z" fill="#edbc62" stroke="#31565a" stroke-width="3"/>
        <path d="M547 202Q599 201 666 217L549 220Z" fill="#f1a94d" stroke="#31565a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M570 229Q603 246 636 229" fill="none" stroke="#d49647" stroke-width="2"/>
        <circle cx="533" cy="197" r="5" fill="#254952"/><circle cx="534" cy="195" r="1.5" fill="white"/>
        <path d="M523 186q7-5 14-1" fill="none" stroke="#31565a" stroke-width="2" stroke-linecap="round"/>
        <path d="M487 181Q486 151 512 149Q541 147 548 180Z" fill="#51897b" stroke="#31565a" stroke-width="3"/>
        <path d="M479 181Q518 174 560 181" fill="none" stroke="#31565a" stroke-width="7" stroke-linecap="round"/>
        <path d="M489 171q28-6 54 1" fill="none" stroke="#a7c3a4" stroke-width="5"/>
        <g class="scarf"><path d="M506 260Q469 259 443 238L436 260L452 259Q475 278 508 274" fill="#cf6652" stroke="#a85246" stroke-width="2"/><path d="M500 269Q465 277 437 268L444 288L457 282Q482 291 514 275" fill="#e07b60"/></g>
        <path d="M497 256q17 10 38 5l-1 15q-21 3-39-7Z" fill="#de745c" stroke="#b35d4c" stroke-width="2"/>
        <g class="wing"><path d="M424 288Q450 275 476 296Q506 314 582 273Q591 270 595 278Q557 324 498 329Q448 339 424 306" fill="#f2f2e2" stroke="#31565a" stroke-width="3" stroke-linecap="round"/><path d="M440 303q24 17 52 13M447 293q18 15 37 13" fill="none" stroke="#c0d1c4" stroke-width="3" stroke-linecap="round"/></g>
      </g>
      <circle cx="477" cy="429" r="15" fill="#f6e4b3" stroke="#31565a" stroke-width="4"/>
      <g transform="translate(477 429)"><g class="spin"><path d="M0 0H31" stroke="#31565a" stroke-width="6" stroke-linecap="round"/><g transform="translate(31 0)"><g style="animation: rotation 1.3s linear infinite reverse"><path d="M-15 4H17" stroke="#31565a" stroke-width="5" stroke-linecap="round"/><path d="M-12-3Q-4-12 4-7L19 0Q22 6 12 6H-12Z" fill="#e4a447" stroke="#31565a" stroke-width="2"/></g></g></g></g>
      <g fill="none" stroke="#faf9e9" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M267 280h48M246 293h53M282 306h32"/></g>
    </svg>
  </div>
  <footer><span>海风正好 · 今天也不赶时间</span><button id="toggle" type="button" aria-pressed="false">暂停动画</button></footer>
</main>
<script>
  const scene = document.getElementById('scene');
  const button = document.getElementById('toggle');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    scene.classList.add('paused');
    button.textContent = '播放动画';
    button.setAttribute('aria-pressed', 'true');
  }
  button.addEventListener('click', () => {
    const paused = scene.classList.toggle('paused');
    if (!paused) scene.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'running');
    button.textContent = paused ? '播放动画' : '暂停动画';
    button.setAttribute('aria-pressed', String(paused));
  });
</script>
</body>
</html>
